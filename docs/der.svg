    <text x="65" y="753" fill="#0f172a" font-size="13" font-weight="bold">LEGENDA E CONCEITOS DO MER ESTENDIDO:</text>
    
    <!-- Item 1: Agregação -->
    <rect x="65" y="769" width="18" height="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="92" y="780" fill="#334155" font-size="11.5"><tspan font-weight="bold">Agregação (PACOTE_RESPOSTA):</tspan> Envolve a relação ternária [Avaliador + Avaliado + Avaliação], permitindo que a resposta (RF5) se ligue a ela.</text>

    <!-- Item 2: Especialização -->
    <circle cx="74" cy="805" r="8" fill="#ffffff" stroke="#1e40af" stroke-width="1.5" />
    <text x="71" y="809" fill="#1e40af" font-size="10" font-weight="bold">d</text>
    <text x="92" y="809" fill="#334155" font-size="11.5"><tspan font-weight="bold">Generalização/Especialização Total Disjunta (d):</tspan> Linha dupla indica totalidade; 'd' indica que a questão é texto livre OU múltipla escolha.</text>

    <!-- Item 3: Entidade Fraca -->
    <rect x="65" y="828" width="18" height="12" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.2" />
    <rect x="67" y="830" width="14" height="8" fill="none" stroke="#ffffff" stroke-width="0.8" />
    <text x="92" y="838" fill="#334155" font-size="11.5"><tspan font-weight="bold">Entidade Fraca (ALTERNATIVA):</tspan> Borda dupla e chave parcial (tracejada); depende existencialmente de Q_MULTIPLA_ESCOLHA via POSSUI_ALTERNATIVA.</text>

    <!-- Item 4: Auto-relacionamento -->
    <text x="92" y="867" fill="#334155" font-size="11.5"><tspan font-weight="bold">Auto-relacionamento e Papéis (RF4/RF6):</tspan> USUARIO participa como [Avaliador] e [Avaliado] na mesma avaliação, viabilizando o ciclo 360°.</text>
    
